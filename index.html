<html lang="zh-Hant">
<head>

<title>Orchid's Schedule</title>
<style>
:root{--bg:#fff8f5;--card:#fffefa;--text:#5a474d;--muted:#9b848c;--line:#efdde2;--accent:#765b65;--work:#dcecff;--clinic:#eadfff;--trip:#e2f2e1;--date:#ffe0e8;--personal:#fff1c9;--todo:#efeae7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 6%,#ffe7ee 0 72px,transparent 73px),radial-gradient(circle at 94% 16%,#fff0cf 0 58px,transparent 59px),linear-gradient(180deg,#fffaf7,#fff7f3)}
button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:16px 14px 92px}.top{position:sticky;top:0;z-index:9;background:#fff8f5e8;backdrop-filter:blur(14px);padding:8px 0 10px}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{margin:0;font-size:23px}.muted{color:var(--muted)}.nav,.filters,.tripdays,.actions{display:flex;gap:7px;overflow:auto}.nav{margin-top:10px}.btn,.nav button,.filters button,.tripdays button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:9px 12px}.nav button.active,.filters button.active,.tripdays button.active{background:var(--accent);color:white}.page{display:none}.page.active{display:block}.hero,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 18px #9d78840f}.hero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#fff,#ffeaf0)}.catface{font-size:46px;float:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#fff9fb;padding:12px;border-radius:16px;text-align:center}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{margin:18px 0}.sectionhead,.calendarhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.event{display:flex;gap:10px;padding:11px 12px;border-bottom:1px dashed var(--line);align-items:flex-start}.event:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}.grow{flex:1}.event h4{margin:0 0 3px;font-size:14px}.event p{margin:0;font-size:12px;color:var(--muted)}.monthtitle{font-size:23px;font-weight:800}.calendarhead{margin:14px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:110px;background:#fffefa;border:1px solid var(--line);border-radius:15px;padding:6px;overflow:hidden}.day:nth-child(7n),.day:nth-child(7n+1){background:#fff9fb}.day.out{opacity:.35}.dn{font-weight:800;font-size:12px}.holiday{font-size:9px;color:#c95c76}.chip{display:block;width:100%;border:0;border-radius:8px;padding:3px 5px;margin:3px 0;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#493b40}.search{display:flex;gap:7px;margin:10px 0}.search input{flex:1}.field input,.field select,.field textarea,.search input,.memo textarea,.todoInput input,.shopInput input{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:10px}.agendaDate{font-weight:800;margin:16px 0 6px}.triphero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#eaf8e9,#fff1f6);border-radius:22px}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:26px;box-shadow:0 6px 18px #765b6555}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffaf9;border-radius:26px 26px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.sheetactions{display:flex;justify-content:space-between;margin-top:14px}.primary{background:var(--accent);color:white;border:0;border-radius:13px;padding:11px 14px}.danger{background:white;color:#b54c64;border:1px solid #efc2ce;border-radius:13px;padding:10px}.memo textarea{min-height:320px;resize:vertical;line-height:1.7}.todoInput,.shopInput{display:flex;gap:8px}.todoList,.shopList{margin-top:12px}.todoItem,.shopItem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px dashed var(--line)}.todoItem:last-child,.shopItem:last-child{border:0}.doneText{text-decoration:line-through;opacity:.55}.progressBox{margin:12px 0}.progressTrack{height:12px;background:#f1e8e5;border-radius:999px;overflow:hidden}.progressBar{height:100%;background:linear-gradient(90deg,#e6a4b8,#bfa2d8);width:0}.progressLabel{font-size:12px;color:var(--muted);margin-top:5px}.tripGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:14px;align-items:start}.tripCol{padding:14px}.timeline{border-left:3px dotted #e7aebe;margin-left:6px}.photoBox{margin:12px 0;padding:12px;border:1px dashed #dfc4cc;border-radius:16px;background:#fffafc}.photoBox input{max-width:100%}.photoPreview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photoPreview img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.small{font-size:12px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:92px;padding:4px}.chip{font-size:8px}.grid,.tripGrid{grid-template-columns:1fr}.photoPreview{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="brand"><div><h1>🐾 Orchid's Schedule</h1><div class="muted">工作・生活・旅行・備忘 ฅ^•ﻌ•^ฅ</div></div><button class="btn" id="backup">🐟 備份</button></div><div class="nav" id="nav"><button class="active" data-page="home">🏠 首頁</button><button data-page="calendar">🐾 月曆</button><button data-page="agenda">🧶 總覽</button><button data-page="todoPage">✅ 代辦</button><button data-page="memo">📝 備忘錄</button><button data-page="trip">✈️ 旅遊</button></div></div><main><section id="home" class="page active"></section><section id="calendar" class="page"></section><section id="agenda" class="page"></section><section id="todoPage" class="page"></section><section id="memo" class="page"></section><section id="trip" class="page"></section></main></div>
<button class="fab" id="add">＋</button><input id="importFile" type="file" accept="application/json" hidden>
<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h3>🐾 新增／編輯行程</h3><button class="btn" id="close" type="button">✕</button></div><form id="form"><input type="hidden" id="eid"><div class="grid"><div class="field"><label>日期</label><input id="date" type="date" required></div><div class="field"><label>分類</label><select id="type"><option value="work">三立</option><option value="clinic">櫃台</option><option value="trip">旅遊</option><option value="date">約會／聚餐</option><option value="personal">個人</option><option value="todo">待辦</option></select></div><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>結束</label><input id="end" type="time"></div><div class="field full"><label>行程</label><input id="title" required></div><div class="field"><label>地點</label><input id="location"></div><div class="field"><label>標籤</label><input id="tag"></div><div class="field full"><label>備註</label><textarea id="note"></textarea></div></div><div class="sheetactions"><button type="button" class="danger" id="del">刪除</button><div><button type="button" class="btn" id="cancel">取消</button> <button class="primary">🐾 儲存</button></div></div></form></div></div>
<script>
const T={work:{n:'三立',c:'#dcecff',d:'#6090cf'},clinic:{n:'櫃台',c:'#eadfff',d:'#8665c4'},trip:{n:'旅遊',c:'#e2f2e1',d:'#5c9b6b'},date:{n:'約會／聚餐',c:'#ffe0e8',d:'#ce748f'},personal:{n:'個人',c:'#fff1c9',d:'#c89e3b'},todo:{n:'待辦',c:'#efeae7',d:'#89837f'}};const H={'2026-09-25':'中秋節','2026-09-28':'教師節補假','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'補假'};const KEY='planner-2026-v3-cat',MEMO_KEY='orchid-memo-v1',TODO_KEY='orchid-todos-v1',SHOP_KEY='orchid-shop-v1',PHOTOS_KEY='orchid-trip-photos-v1';let month=8,filter='all',tripDay='2026-10-04';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function seed(){let a=[];const o=new Set([4,5,12,13,19,25,28]);for(let d=1;d<=30;d++)if(!o.has(d)&&d!==27)a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'work',title:'三立｜早班',start:'07:00',end:'16:00',tag:'固定早班'});a.push({id:uid(),date:'2026-09-27',type:'work',title:'三立｜支援晨班',start:'',end:'',tag:'支援晨班'});const c=new Set([5,12,18,24,28]);for(let d=1;d<=30;d++){let x=new Date(2026,8,d);if(x.getDay()!==0&&!c.has(d))a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'clinic',title:'櫃台｜晚班',start:'18:00',end:'22:00',tag:'固定晚班'})}a.push({id:uid(),date:'2026-09-04',type:'clinic',title:'櫃台｜早診代班',start:'',end:'',tag:'代班'},{id:uid(),date:'2026-09-04',type:'clinic',title:'櫃台｜午診代班',start:'',end:'',tag:'代班'});for(let d=4;d<=8;d++)a.push({id:uid(),date:`2026-10-${String(d).padStart(2,'0')}`,type:'trip',title:`福岡旅行｜Day ${d-3}`,start:'',end:'',location:'福岡',tag:'福岡旅遊'});return a}
let events=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x){x=x.map(e=>({...e,title:(e.title||'').replace(/^CC｜/,'櫃台｜').replace(/^診所｜/,'櫃台｜')}));localStorage.setItem(KEY,JSON.stringify(x));return x}return seed()}catch{return seed()}})();let todos=(()=>{try{return JSON.parse(localStorage.getItem(TODO_KEY))||[]}catch{return []}})();let shops=(()=>{try{return JSON.parse(localStorage.getItem(SHOP_KEY))||[]}catch{return []}})();let photos=(()=>{try{return JSON.parse(localStorage.getItem(PHOTOS_KEY))||{}}catch{return {}}})();const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sort=a=>[...a].sort((x,y)=>(x.date+(x.start||'')).localeCompare(y.date+(y.start||'')));const fmt=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00'));
function persist(){localStorage.setItem(KEY,JSON.stringify(events));render()}function ev(e){return `<div class="event"><span class="dot" style="background:${T[e.type].d}"></span><div class="grow"><h4>${esc(e.title)}</h4><p>${e.start?(e.start+(e.end?'–'+e.end:'')):(e.tag||'全天')}${e.location?' ・ '+esc(e.location):''}</p></div><button class="btn" onclick="edit('${e.id}')">✎</button></div>`}
function home(){let up=sort(events).slice(0,6),done=todos.filter(x=>x.done).length;homeEl.innerHTML=`<div class="hero"><span class="catface">🐱</span><h2>今天也要好好安排喵 ♡</h2><p class="muted">Orchid 的溫馨貓咪手帳</p><div class="stats"><div class="stat"><b>${events.filter(e=>e.type==='work').length}</b><span>💼 三立</span></div><div class="stat"><b>${events.filter(e=>e.type==='clinic').length}</b><span>💜 櫃台</span></div><div class="stat"><b>${events.filter(e=>e.type==='trip').length}</b><span>✈️ 旅遊</span></div><div class="stat"><b>${done}/${todos.length}</b><span>✅ 代辦完成</span></div></div></div><div class="section"><h3>🐾 近期行程</h3><div class="card">${up.map(ev).join('')||'<div class="empty">目前沒有行程</div>'}</div></div>`}
function cal(){let first=new Date(2026,month,1),s=new Date(first);s.setDate(1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);let ds=ymd(d),ls=sort(events.filter(e=>e.date===ds));cells+=`<div class="day ${d.getMonth()===month?'':'out'}"><div class="dn">${d.getDate()} ${i%9===0?'🐾':''}</div>${H[ds]?`<div class="holiday">${H[ds]}</div>`:''}${ls.slice(0,4).map(e=>`<button class="chip" style="background:${T[e.type].c}" onclick="edit('${e.id}')">${e.start?e.start+' ':''}${esc(e.title)}</button>`).join('')}</div>`}calendarEl.innerHTML=`<div class="calendarhead"><div><div class="muted">🐈 Monthly calendar</div><div class="monthtitle">2026年 ${month===8?'9':'10'}月</div></div><div><button class="btn" onclick="chg(-1)">←</button> <button class="btn" onclick="chg(1)">→</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="wd">週${x}</div>`).join('')}${cells}</div>`}function chg(n){month=Math.max(8,Math.min(9,month+n));cal()}
function agenda(q=''){let ls=sort(events.filter(e=>(filter==='all'||e.type===filter)&&(`${e.title} ${e.location||''}`).includes(q))),out='',last='';for(const e of ls){if(e.date!==last){if(last)out+='</div>';out+=`<div class="agendaDate">🐾 ${fmt(e.date)}</div><div class="card">`;last=e.date}out+=ev(e)}if(last)out+='</div>';agendaEl.innerHTML=`<div class="sectionhead"><h3>🧶 行程總覽</h3><button class="btn" onclick="importFile.click()">匯入</button></div><div class="search"><input placeholder="🔍 搜尋行程" oninput="agenda(this.value)"></div><div class="filters"><button onclick="setF('all')">全部</button>${Object.keys(T).map(k=>`<button onclick="setF('${k}')">${T[k].n}</button>`).join('')}</div>${out||'<div class="empty">沒有符合的行程</div>'}`}function setF(x){filter=x;agenda()}
function renderTodo(){let done=todos.filter(x=>x.done).length,p=todos.length?Math.round(done/todos.length*100):0;todoEl.innerHTML=`<div class="sectionhead"><h3>✅ 代辦清單</h3><span class="muted">${done}/${todos.length} 完成</span></div><div class="panel" style="padding:14px"><div class="todoInput"><input id="todoNew" placeholder="新增代辦事項…"><button class="primary" onclick="addTodo()">新增</button></div><div class="progressBox"><div class="progressTrack"><div class="progressBar" style="width:${p}%"></div></div><div class="progressLabel">完成進度 ${p}%</div></div><div class="todoList">${todos.map(t=>`<div class="todoItem"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')"><div class="grow ${t.done?'doneText':''}">${esc(t.text)}</div><button class="btn" onclick="removeTodo('${t.id}')">✕</button></div>`).join('')||'<div class="empty">還沒有代辦事項</div>'}</div></div>`}function addTodo(){let el=document.getElementById('todoNew'),v=el.value.trim();if(!v)return;todos.push({id:uid(),text:v,done:false});localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}function toggleTodo(id){let t=todos.find(x=>x.id===id);if(t)t.done=!t.done;localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}function removeTodo(id){todos=todos.filter(x=>x.id!==id);localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}
function renderMemo(){memoEl.innerHTML=`<div class="sectionhead"><h3>📝 備忘錄</h3><button class="btn" onclick="clearMemo()">清空</button></div><div class="memo"><textarea id="memoText" placeholder="寫下想記得的事、靈感、購物提醒……"></textarea></div><p class="muted small">內容會自動儲存在這台裝置的瀏覽器中。</p>`;let ta=document.getElementById('memoText');ta.value=localStorage.getItem(MEMO_KEY)||'';ta.oninput=()=>localStorage.setItem(MEMO_KEY,ta.value)}function clearMemo(){if(confirm('確定要清空備忘錄嗎？')){localStorage.removeItem(MEMO_KEY);renderMemo()}}
function trip(){let days=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],ls=sort(events.filter(e=>e.type==='trip'&&e.date===tripDay));let s=shops.filter(x=>x.date===tripDay),done=s.filter(x=>x.done).length,p=s.length?Math.round(done/s.length*100):0,ps=photos[tripDay]||[];tripEl.innerHTML=`<div class="triphero"><h2>🐱✈️ 福岡・5天旅程</h2><p>10/4–10/8 ・ 行程和購物分開管理更清楚</p></div><div class="tripdays">${days.map((d,i)=>`<button class="${tripDay===d?'active':''}" onclick="tripDay='${d}';trip()">Day ${i+1}<br><small>${d.slice(5)}</small></button>`).join('')}</div><h3>🐾 ${fmt(tripDay)}</h3><div class="tripGrid"><div class="card tripCol"><div class="sectionhead"><h3>📍 行程</h3><button class="btn" onclick="newTripEvent()">＋ 新增</button></div><div class="timeline">${ls.map(ev).join('')||'<div class="empty">尚未安排詳細行程</div>'}</div><div class="photoBox"><b>📷 當日照片</b><p class="muted small">可新增照片到這一天；照片只儲存在目前這台裝置。</p><input type="file" accept="image/*" multiple onchange="addPhotos(event)"><div class="photoPreview">${ps.map((src,i)=>`<div><img src="${src}" alt="trip photo"><button class="btn" style="width:100%;margin-top:5px" onclick="removePhoto(${i})">移除</button></div>`).join('')}</div></div></div><div class="card tripCol"><div class="sectionhead"><h3>🛍️ 購物清單</h3><span class="muted">${done}/${s.length}</span></div><div class="shopInput"><input id="shopNew" placeholder="想買什麼？"><button class="primary" onclick="addShop()">新增</button></div><div class="progressBox"><div class="progressTrack"><div class="progressBar" style="width:${p}%"></div></div><div class="progressLabel">完成進度 ${p}%</div></div><div class="shopList">${s.map(x=>`<div class="shopItem"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}')"><div class="grow ${x.done?'doneText':''}">${esc(x.text)}</div><button class="btn" onclick="removeShop('${x.id}')">✕</button></div>`).join('')||'<div class="empty">這天還沒有購物清單</div>'}</div></div></div>`}function newTripEvent(){openNew();date.value=tripDay;type.value='trip'}function addShop(){let el=document.getElementById('shopNew'),v=el.value.trim();if(!v)return;shops.push({id:uid(),date:tripDay,text:v,done:false});localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}function toggleShop(id){let x=shops.find(y=>y.id===id);if(x)x.done=!x.done;localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}function removeShop(id){shops=shops.filter(x=>x.id!==id);localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}
async function addPhotos(e){let files=[...e.target.files];if(!photos[tripDay])photos[tripDay]=[];for(const f of files){if(photos[tripDay].length>=9)break;let src=await compressImage(f);photos[tripDay].push(src)}try{localStorage.setItem(PHOTOS_KEY,JSON.stringify(photos))}catch(err){alert('照片儲存空間已滿，請移除部分照片後再試。')}trip()}function compressImage(file){return new Promise(res=>{let img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{let c=document.createElement('canvas'),max=900,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)})}function removePhoto(i){photos[tripDay].splice(i,1);localStorage.setItem(PHOTOS_KEY,JSON.stringify(photos));trip()}
function render(){home();cal();agenda();renderTodo();renderMemo();trip()}function openNew(){form.reset();eid.value='';date.value=month===8?'2026-09-01':'2026-10-01';del.style.visibility='hidden';modal.classList.add('open')}function edit(id){let e=events.find(x=>x.id===id);if(!e)return;eid.value=e.id;date.value=e.date;type.value=e.type;start.value=e.start||'';end.value=e.end||'';title.value=e.title;location.value=e.location||'';tag.value=e.tag||'';note.value=e.note||'';del.style.visibility='visible';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}

ip');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
