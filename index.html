<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6efe7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="我的行事曆"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>2026 生活・工作・旅遊行事曆</title>
<style>
:root{--bg:#f7f3ee;--card:#fffdfa;--text:#302b2c;--muted:#817a75;--line:#e7ddd5;--accent:#845f73;--work:#cfe3ff;--clinic:#decffc;--trip:#d6f0da;--personal:#fff1bd;--date:#ffe4ec;--todo:#e6e4e1}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#1e1c1c;--card:#292626;--text:#f7f2ef;--muted:#b8afaa;--line:#403b39;--accent:#e3bfd0}button,input,select,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:16px 14px 90px}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);padding:8px 0 10px}.brand{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand h1{font-size:20px;margin:0}.muted{color:var(--muted)}.actions,.nav,.filters,.tripdays{display:flex;gap:7px;overflow:auto}.btn,.nav button,.filters button,.tripdays button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px}.nav{margin-top:10px}.nav button.active,.filters button.active,.tripdays button.active{background:var(--text);color:var(--card)}.page{display:none}.page.active{display:block}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:20px}.hero{padding:18px;margin:14px 0;background:linear-gradient(135deg,#fff8f4,#f5ebf1)}body.dark .hero{background:var(--card)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:rgba(255,255,255,.62);padding:12px;border-radius:14px}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:#756c68}.section{margin:18px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.event{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);align-items:flex-start}.event:last-child{border-bottom:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}.grow{flex:1}.event h4{margin:0 0 3px;font-size:14px}.event p{margin:0;font-size:12px;color:var(--muted)}.calendarhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0}.monthtitle{font-size:22px;font-weight:800}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}.day.out{opacity:.35}.dn{font-weight:800;font-size:12px}.holiday{font-size:9px;color:#b23b3b;margin:3px 0}.chip{display:block;width:100%;border:0;border-radius:7px;padding:3px 5px;margin:3px 0;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#393333}.search{display:flex;gap:7px;margin:10px 0}.search input{flex:1}.field input,.field select,.field textarea,.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:11px;padding:10px}.agendaDate{font-weight:800;margin:16px 0 6px}.triphero{padding:18px;margin:14px 0;background:linear-gradient(135deg,#e9f7eb,#fef9ef);border-radius:20px;border:1px solid #dce9dd}.timeline{border-left:2px solid #acd3b5;margin-left:10px;padding-left:14px}.fab{position:fixed;right:18px;bottom:22px;width:56px;height:56px;border-radius:50%;border:0;background:var(--text);color:var(--card);font-size:28px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.sheetactions{display:flex;justify-content:space-between;margin-top:14px;gap:8px}.primary{background:var(--text);color:var(--card);border:0;border-radius:11px;padding:11px 14px}.danger{background:transparent;color:#b23b3b;border:1px solid #e5bcbc;border-radius:11px;padding:10px 13px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:92px;padding:4px}.chip{font-size:8px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head><body><div class="app"><div class="top"><div class="brand"><div><h1>生活・工作・旅遊</h1><div class="muted">2026 Sep–Oct Planner</div></div><div class="actions"><button class="btn" id="theme">☾</button><button class="btn" id="backup">備份</button></div></div><div class="nav" id="nav"><button class="active" data-page="home">首頁</button><button data-page="calendar">月曆</button><button data-page="agenda">總覽</button><button data-page="trip">旅遊</button></div></div><main><section id="home" class="page active"></section><section id="calendar" class="page"></section><section id="agenda" class="page"></section><section id="trip" class="page"></section></main></div><button class="fab" id="add">＋</button><input id="importFile" type="file" accept="application/json" hidden><div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h3 id="modalTitle">新增行程</h3><button class="btn" id="close">✕</button></div><form id="form"><input type="hidden" id="eid"><div class="grid"><div class="field"><label>日期</label><input id="date" type="date" min="2026-09-01" max="2026-10-31" required></div><div class="field"><label>分類</label><select id="type"><option value="work">三立</option><option value="clinic">診所</option><option value="trip">旅遊</option><option value="date">約會／聚餐</option><option value="personal">個人</option><option value="todo">待辦</option></select></div><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>結束</label><input id="end" type="time"></div><div class="field full"><label>行程</label><input id="title" required></div><div class="field"><label>地點</label><input id="location"></div><div class="field"><label>標籤</label><input id="tag"></div><div class="field full"><label>備註</label><textarea id="note"></textarea></div></div><div class="sheetactions"><button type="button" class="danger" id="del">刪除</button><div><button type="button" class="btn" id="cancel">取消</button> <button class="primary">儲存</button></div></div></form></div></div>
<script>
const T={work:{n:'三立',c:'#cfe3ff',d:'#6090cf'},clinic:{n:'診所',c:'#decffc',d:'#8665c4'},trip:{n:'旅遊',c:'#d6f0da',d:'#5c9b6b'},date:{n:'約會／聚餐',c:'#ffe4ec',d:'#ce748f'},personal:{n:'個人',c:'#fff1bd',d:'#c89e3b'},todo:{n:'待辦',c:'#e6e4e1',d:'#89837f'}};const H={'2026-09-25':'中秋節','2026-09-28':'教師節補假','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'臺灣光復暨金門古寧頭大捷紀念日','2026-10-26':'補假'};const KEY='planner-2026-v2';let month=8,filter='all',tripDay='2026-10-04';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function seed(){let a=[];const offTri=new Set([4,5,12,13,19,25,28]);for(let d=1;d<=30;d++){if(!offTri.has(d)&&d!==27)a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'work',title:'三立｜早班',start:'07:00',end:'16:00',location:'',tag:'固定早班',note:'',done:false})}a.push({id:uid(),date:'2026-09-27',type:'work',title:'三立｜支援晨班',start:'',end:'',location:'',tag:'支援晨班',note:'未提供確切時間',done:false});const offClinic=new Set([5,12,18,24,28]);for(let d=1;d<=30;d++){const dt=new Date(2026,8,d);if(dt.getDay()!==0&&!offClinic.has(d))a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'clinic',title:'診所｜晚班',start:'18:00',end:'22:00',location:'',tag:'固定晚班',note:'',done:false})}a.push({id:uid(),date:'2026-09-04',type:'clinic',title:'診所｜早診代班',start:'',end:'',location:'',tag:'代班',note:'未提供確切時間',done:false},{id:uid(),date:'2026-09-04',type:'clinic',title:'診所｜午診代班',start:'',end:'',location:'',tag:'代班',note:'未提供確切時間',done:false});for(let d=4;d<=8;d++)a.push({id:uid(),date:`2026-10-${String(d).padStart(2,'0')}`,type:'trip',title:`福岡旅行｜Day ${d-3}`,start:'',end:'',location:'福岡',tag:'福岡旅遊',note:'',done:false});return a}let events=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||seed()}catch{return seed()}})();const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sort=a=>[...a].sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start));const fmt=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00'));function save(){localStorage.setItem(KEY,JSON.stringify(events));render()}function ev(e){return `<div class="event"><span class="dot" style="background:${T[e.type].d}"></span><div class="grow"><h4>${esc(e.title)}</h4><p>${e.start?(e.start+(e.end?'–'+e.end:'')):(e.tag||'全天')}${e.location?' ・ '+esc(e.location):''}${e.note?' ・ '+esc(e.note):''}</p></div><button class="btn" onclick="edit('${e.id}')">編輯</button></div>`}function home(){const ds='2026-09-01',up=sort(events).slice(0,6);homeEl.innerHTML=`<div class="hero"><h2 style="margin:0">2026 秋季行程準備好了 ✦</h2><p class="muted">工作、生活與福岡旅遊集中管理</p><div class="stats"><div class="stat"><b>${events.filter(e=>e.type==='work').length}</b><span>三立</span></div><div class="stat"><b>${events.filter(e=>e.type==='clinic').length}</b><span>診所</span></div><div class="stat"><b>${events.filter(e=>e.type==='trip').length}</b><span>旅遊</span></div><div class="stat"><b>${events.length}</b><span>全部行程</span></div></div></div><div class="section"><div class="sectionhead"><h3>近期行程</h3></div><div class="card">${up.map(ev).join('')}</div></div><div class="section"><div class="card" style="padding:15px"><b>目前規則</b><p>三立：9月固定 07:00–16:00，已排除指定休假；9/27 支援晨班。</p><p>診所：週日休，其餘原則 18:00–22:00，已排除指定排休；9/4 另有早、午代班。</p><p>福岡：10/4–10/8。10月工作班表目前未自行推測。</p></div></div>`}function cal(){let first=new Date(2026,month,1),startD=new Date(first);startD.setDate(1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){let d=new Date(startD);d.setDate(startD.getDate()+i);let ds=ymd(d),ls=sort(events.filter(e=>e.date===ds));cells+=`<div class="day ${d.getMonth()===month?'':'out'}" onclick="if(event.target===this)openNew('${ds}')"><div class="dn">${d.getDate()}</div>${H[ds]?`<div class="holiday">${H[ds]}</div>`:''}${ls.slice(0,4).map(e=>`<button class="chip" style="background:${T[e.type].c}" onclick="event.stopPropagation();edit('${e.id}')">${e.start?e.start+' ':''}${esc(e.title)}</button>`).join('')}</div>`}calendarEl.innerHTML=`<div class="calendarhead"><div><div class="muted">Monthly calendar</div><div class="monthtitle">2026年 ${month===8?'9':'10'}月</div></div><div><button class="btn" onclick="chg(-1)">←</button> <button class="btn" onclick="chg(1)">→</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="wd">週${x}</div>`).join('')}${cells}</div>`}function chg(n){month=Math.max(8,Math.min(9,month+n));cal()}function agenda(q=''){let ls=sort(events.filter(e=>(filter==='all'||e.type===filter)&&(`${e.title} ${e.location} ${e.note} ${e.tag}`).toLowerCase().includes(q.toLowerCase()))),out='',last='';for(const e of ls){if(e.date!==last){if(last)out+='</div>';out+=`<div class="agendaDate">${fmt(e.date)}${H[e.date]?' ・ '+H[e.date]:''}</div><div class="card">`;last=e.date}out+=ev(e)}if(last)out+='</div>';agendaEl.innerHTML=`<div class="sectionhead" style="margin-top:14px"><h3>9–10月 行程總覽</h3><button class="btn" onclick="importFile.click()">匯入</button></div><div class="search"><input placeholder="搜尋行程、地點、備註" oninput="agenda(this.value)"></div><div class="filters"><button class="${filter==='all'?'active':''}" onclick="setF('all')">全部</button>${Object.keys(T).map(k=>`<button class="${filter===k?'active':''}" onclick="setF('${k}')">${T[k].n}</button>`).join('')}</div>${out||'<div class="empty">沒有行程</div>'}`}function setF(x){filter=x;agenda()}function trip(){let days=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],ls=sort(events.filter(e=>e.type==='trip'&&e.date===tripDay));tripEl.innerHTML=`<div class="triphero"><div class="muted">FUKUOKA 2026</div><h2>福岡・5天旅程 ✈️</h2><p>10/4–10/8</p></div><div class="tripdays">${days.map((d,i)=>`<button class="${d===tripDay?'active':''}" onclick="tripDay='${d}';trip()">Day ${i+1}<br><small>${d.slice(5).replace('-','/')}</small></button>`).join('')}</div><div class="sectionhead"><h3>${fmt(tripDay)}</h3><button class="btn" onclick="openNew('${tripDay}','trip')">＋新增</button></div><div class="card timeline">${ls.length?ls.map(ev).join(''):'<div class="empty">尚無細部行程</div>'}</div>`}function render(){home();cal();agenda();trip()}function openNew(d=month===8?'2026-09-01':'2026-10-01',t='personal'){form.reset();eid.value='';date.value=d;type.value=t;del.style.visibility='hidden';modalTitle.textContent='新增行程';modal.classList.add('open')}function edit(id){let e=events.find(x=>x.id===id);if(!e)return;eid.value=e.id;date.value=e.date;type.value=e.type;start.value=e.start||'';end.value=e.end||'';title.value=e.title;location.value=e.location||'';tag.value=e.tag||'';note.value=e.note||'';del.style.visibility='visible';modalTitle.textContent='編輯行程';modal.classList.add('open')}form.onsubmit=e=>{e.preventDefault();let o={id:eid.value||uid(),date:date.value,type:type.value,title:title.value.trim(),start:start.value,end:end.value,location:location.value.trim(),tag:tag.value.trim(),note:note.value.trim(),done:false},i=events.findIndex(x=>x.id===o.id);i>=0?events[i]=o:events.push(o);save();modal.classList.remove('open')};del.onclick=()=>{if(eid.value)events=events.filter(x=>x.id!==eid.value);save();modal.classList.remove('open')};close.onclick=cancel.onclick=()=>modal.classList.remove('open');add.onclick=()=>openNew();nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(e.target.dataset.page).classList.add('active')};theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('planner-dark',document.body.classList.contains('dark')?'1':'0')};if(localStorage.getItem('planner-dark')==='1')document.body.classList.add('dark');backup.onclick=()=>{let b=new Blob([JSON.stringify({events},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='planner-backup.json';a.click()};importFile.onchange=async()=>{try{let x=JSON.parse(await importFile.files[0].text());if(!Array.isArray(x.events))throw 0;events=x.events;save();alert('匯入完成')}catch{alert('備份檔格式不正確')}};const homeEl=document.getElementById('home'),calendarEl=document.getElementById('calendar'),agendaEl=document.getElementById('agenda'),tripEl=document.getElementById('trip');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
