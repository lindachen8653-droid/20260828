<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffd9e5"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Orchid's Schedule</title><style>:root{--bg:#fff7f4;--card:#fff;--text:#55434a;--muted:#987f88;--line:#f1dce3;--pink:#ffdce8;--work:#d9eaff;--clinic:#eadcff;--trip:#dff3df;--personal:#fff0bd;--date:#ffdce8;--todo:#eee9e7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 10% 8%,#ffe5ee 0 70px,transparent 71px),radial-gradient(circle at 92% 20%,#fff0cc 0 55px,transparent 56px),var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:16px 14px 90px}.top{position:sticky;top:0;z-index:5;background:#fff7f4e8;backdrop-filter:blur(14px);padding:8px 0 10px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:22px}.muted{color:var(--muted)}.actions,.nav,.filters,.tripdays{display:flex;gap:7px;overflow:auto}.btn,.nav button,.filters button,.tripdays button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:9px 12px}.nav{margin-top:10px}.nav button.active,.filters button.active,.tripdays button.active{background:#765b65;color:white}.page{display:none}.page.active{display:block}.hero,.card{background:#fffefa;border:1px solid var(--line);border-radius:22px;box-shadow:0 5px 16px #b68c9a12}.hero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#fff,#ffe9f0)}.catface{font-size:44px;float:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#fff9fb;padding:12px;border-radius:16px;text-align:center}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{margin:18px 0}.sectionhead,.calendarhead{display:flex;justify-content:space-between;align-items:center}.event{display:flex;gap:10px;padding:11px 12px;border-bottom:1px dashed var(--line);align-items:flex-start}.event:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}.grow{flex:1}.event h4{margin:0 0 3px;font-size:14px}.event p{margin:0;font-size:12px;color:var(--muted)}.monthtitle{font-size:23px;font-weight:800}.calendarhead{margin:14px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:110px;background:#fffefa;border:1px solid var(--line);border-radius:15px;padding:6px;overflow:hidden}.day:nth-child(7n),.day:nth-child(7n+1){background:#fff9fb}.day.out{opacity:.35}.dn{font-weight:800;font-size:12px}.holiday{font-size:9px;color:#c95c76}.chip{display:block;width:100%;border:0;border-radius:8px;padding:3px 5px;margin:3px 0;text-align:left;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#493b40}.search{display:flex;gap:7px;margin:10px 0}.search input{flex:1}.field input,.field select,.field textarea,.search input{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:10px}.agendaDate{font-weight:800;margin:16px 0 6px}.triphero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#eaf8e9,#fff1f6);border-radius:22px}.timeline{border-left:3px dotted #e7aebe;margin-left:10px}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:#765b65;color:white;font-size:26px;box-shadow:0 6px 18px #765b6555}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fffaf9;border-radius:26px 26px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.sheetactions{display:flex;justify-content:space-between;margin-top:14px}.primary{background:#765b65;color:white;border:0;border-radius:13px;padding:11px 14px}.danger{background:white;color:#b54c64;border:1px solid #efc2ce;border-radius:13px;padding:10px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:92px;padding:4px}.chip{font-size:8px}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><div class="brand"><div><h1>🐾 Orchid's Schedule</h1><div class="muted">工作・生活・旅行 ฅ^•ﻌ•^ฅ</div></div><button class="btn" id="backup">🐟 備份</button></div><div class="nav" id="nav"><button class="active" data-page="home">🏠 首頁</button><button data-page="calendar">🐾 月曆</button><button data-page="agenda">🧶 總覽</button><button data-page="trip">✈️ 旅遊</button></div></div><main><section id="home" class="page active"></section><section id="calendar" class="page"></section><section id="agenda" class="page"></section><section id="trip" class="page"></section></main></div><button class="fab" id="add">＋</button><input id="importFile" type="file" accept="application/json" hidden><div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h3 id="modalTitle">🐾 新增行程</h3><button class="btn" id="close">✕</button></div><form id="form"><input type="hidden" id="eid"><div class="grid"><div class="field"><label>日期</label><input id="date" type="date" required></div><div class="field"><label>分類</label><select id="type"><option value="work">三立</option><option value="clinic">櫃台</option><option value="trip">旅遊</option><option value="date">約會／聚餐</option><option value="personal">個人</option><option value="todo">待辦</option></select></div><div class="field"><label>開始</label><input id="start" type="time"></div><div class="field"><label>結束</label><input id="end" type="time"></div><div class="field full"><label>行程</label><input id="title" required></div><div class="field"><label>地點</label><input id="location"></div><div class="field"><label>標籤</label><input id="tag"></div><div class="field full"><label>備註</label><textarea id="note"></textarea></div></div><div class="sheetactions"><button type="button" class="danger" id="del">刪除</button><div><button type="button" class="btn" id="cancel">取消</button> <button class="primary">🐾 儲存</button></div></div></form></div></div><script>const T={work:{n:'三立',c:'#d9eaff',d:'#6090cf'},clinic:{n:'櫃台',c:'#eadcff',d:'#8665c4'},trip:{n:'旅遊',c:'#dff3df',d:'#5c9b6b'},date:{n:'約會／聚餐',c:'#ffdce8',d:'#ce748f'},personal:{n:'個人',c:'#fff0bd',d:'#c89e3b'},todo:{n:'待辦',c:'#eee9e7',d:'#89837f'}};const H={'2026-09-25':'中秋節','2026-09-28':'教師節補假','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'補假'};const KEY='planner-2026-v3-cat';let month=8,filter='all',tripDay='2026-10-04';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function seed(){let a=[];const o=new Set([4,5,12,13,19,25,28]);for(let d=1;d<=30;d++)if(!o.has(d)&&d!==27)a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'work',title:'三立｜早班',start:'07:00',end:'16:00',tag:'固定早班'});a.push({id:uid(),date:'2026-09-27',type:'work',title:'三立｜支援晨班',start:'',end:'',tag:'支援晨班'});const c=new Set([5,12,18,24,28]);for(let d=1;d<=30;d++){let x=new Date(2026,8,d);if(x.getDay()!==0&&!c.has(d))a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,type:'clinic',title:'櫃台｜晚班',start:'18:00',end:'22:00',tag:'固定晚班'})}a.push({id:uid(),date:'2026-09-04',type:'clinic',title:'櫃台｜早診代班',start:'',end:'',tag:'代班'},{id:uid(),date:'2026-09-04',type:'clinic',title:'櫃台｜午診代班',start:'',end:'',tag:'代班'});for(let d=4;d<=8;d++)a.push({id:uid(),date:`2026-10-${String(d).padStart(2,'0')}`,type:'trip',title:`福岡旅行｜Day ${d-3}`,start:'',end:'',location:'福岡',tag:'福岡旅遊'});return a}let events=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(x){x=x.map(e=>({...e,title:(e.title||'').replace(/^CC｜/,'櫃台｜').replace(/^診所｜/,'櫃台｜')}));localStorage.setItem(KEY,JSON.stringify(x));return x}return seed()}catch{return seed()}})();const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sort=a=>[...a].sort((x,y)=>(x.date+(x.start||'')).localeCompare(y.date+(y.start||'')));const fmt=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00'));function save(){localStorage.setItem(KEY,JSON.stringify(events));render()}function ev(e){return `<div class="event"><span class="dot" style="background:${T[e.type].d}"></span><div class="grow"><h4>${esc(e.title)}</h4><p>${e.start?(e.start+(e.end?'–'+e.end:'')):(e.tag||'全天')}${e.location?' ・ '+esc(e.location):''}</p></div><button class="btn" onclick="edit('${e.id}')">✎</button></div>`}function home(){let up=sort(events).slice(0,6);homeEl.innerHTML=`<div class="hero"><span class="catface">🐱</span><h2>今天也要好好安排喵 ♡</h2><p class="muted">Orchid 的秋季手帳・工作生活旅行都收好</p><div class="stats"><div class="stat"><b>${events.filter(e=>e.type==='work').length}</b><span>💼 三立</span></div><div class="stat"><b>${events.filter(e=>e.type==='clinic').length}</b><span>💜 櫃台</span></div><div class="stat"><b>${events.filter(e=>e.type==='trip').length}</b><span>✈️ 旅遊</span></div><div class="stat"><b>${events.length}</b><span>🐾 全部</span></div></div></div><div class="section"><h3>🐾 近期行程</h3><div class="card">${up.map(ev).join('')}</div></div>`}function cal(){let first=new Date(2026,month,1),s=new Date(first);s.setDate(1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);let ds=ymd(d),ls=sort(events.filter(e=>e.date===ds));cells+=`<div class="day ${d.getMonth()===month?'':'out'}"><div class="dn">${d.getDate()} ${i%9===0?'🐾':''}</div>${H[ds]?`<div class="holiday">${H[ds]}</div>`:''}${ls.slice(0,4).map(e=>`<button class="chip" style="background:${T[e.type].c}" onclick="edit('${e.id}')">${e.start?e.start+' ':''}${esc(e.title)}</button>`).join('')}</div>`}calendarEl.innerHTML=`<div class="calendarhead"><div><div class="muted">🐈 Monthly calendar</div><div class="monthtitle">2026年 ${month===8?'9':'10'}月</div></div><div><button class="btn" onclick="chg(-1)">←</button> <button class="btn" onclick="chg(1)">→</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="wd">週${x}</div>`).join('')}${cells}</div>`}function chg(n){month=Math.max(8,Math.min(9,month+n));cal()}function agenda(q=''){let ls=sort(events.filter(e=>(filter==='all'||e.type===filter)&&(`${e.title} ${e.location||''}`).includes(q))),out='',last='';for(const e of ls){if(e.date!==last){if(last)out+='</div>';out+=`<div class="agendaDate">🐾 ${fmt(e.date)}</div><div class="card">`;last=e.date}out+=ev(e)}if(last)out+='</div>';agendaEl.innerHTML=`<div class="sectionhead"><h3>🧶 行程總覽</h3><button class="btn" onclick="importFile.click()">匯入</button></div><div class="search"><input placeholder="🔍 搜尋行程" oninput="agenda(this.value)"></div><div class="filters"><button onclick="setF('all')">全部</button>${Object.keys(T).map(k=>`<button onclick="setF('${k}')">${T[k].n}</button>`).join('')}</div>${out}`}function setF(x){filter=x;agenda()}function trip(){let days=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],ls=sort(events.filter(e=>e.type==='trip'&&e.date===tripDay));tripEl.innerHTML=`<div class="triphero"><h2>🐱✈️ 福岡・5天旅程</h2><p>10/4–10/8 ・ 帶著好心情出發喵</p></div><div class="tripdays">${days.map((d,i)=>`<button onclick="tripDay='${d}';trip()">Day ${i+1}<br><small>${d.slice(5)}</small></button>`).join('')}</div><h3>🐾 ${fmt(tripDay)}</h3><div class="card timeline">${ls.map(ev).join('')}</div>`}function render(){home();cal();agenda();trip()}function openNew(){form.reset();eid.value='';date.value=month===8?'2026-09-01':'2026-10-01';del.style.visibility='hidden';modal.classList.add('open')}function edit(id){let e=events.find(x=>x.id===id);if(!e)return;eid.value=e.id;date.value=e.date;type.value=e.type;start.value=e.start||'';end.value=e.end||'';title.value=e.title;location.value=e.location||'';tag.value=e.tag||'';note.value=e.note||'';del.style.visibility='visible';modal.classList.add('open')}form.onsubmit=e=>{e.preventDefault();let o={id:eid.value||uid(),date:date.value,type:type.value,title:title.value,start:start.value,end:end.value,location:location.value,tag:tag.value,note:note.value},i=events.findIndex(x=>x.id===o.id);i>=0?events[i]=o:events.push(o);save();modal.classList.remove('open')};del.onclick=()=>{events=events.filter(x=>x.id!==eid.value);save();modal.classList.remove('open')};close.onclick=cancel.onclick=()=>modal.classList.remove('open');add.onclick=openNew;nav.onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(e.target.dataset.page).classList.add('active')};backup.onclick=()=>{let b=new Blob([JSON.stringify({events},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orchids-schedule-backup.json';a.click()};importFile.onchange=async()=>{let x=JSON.parse(await importFile.files[0].text());events=x.events;save()};const homeEl=document.getElementById('home'),calendarEl=document.getElementById('calendar'),agendaEl=document.getElementById('agenda'),tripEl=document.getElementById('trip');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();</script></body></html>
