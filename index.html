<style>
:root{--bg:#fff8f5;--card:#fffefa;--text:#5a474d;--muted:#9b848c;--line:#efdde2;--accent:#765b65;--work:#dcecff;--clinic:#eadfff;--trip:#e2f2e1;--date:#ffe0e8;--personal:#fff1c9;--todo:#efeae7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 6%,#ffe7ee 0 72px,transparent 73px),radial-gradient(circle at 94% 16%,#fff0cf 0 58px,transparent 59px),linear-gradient(180deg,#fffaf7,#fff7f3)}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:16px 14px 92px}.top{position:sticky;top:0;z-index:9;background:#fff8f5e8;backdrop-filter:blur(14px);padding:8px 0 10px}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{margin:0;font-size:23px}.muted{color:var(--muted)}.nav,.filters,.tripdays,.actions,.calendarFilters{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}.nav::-webkit-scrollbar,.filters::-webkit-scrollbar,.tripdays::-webkit-scrollbar,.calendarFilters::-webkit-scrollbar{display:none}.nav{margin-top:10px}.btn,.nav button,.filters button,.tripdays button,.calendarFilters button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;padding:9px 12px;white-space:nowrap;flex:0 0 auto;touch-action:manipulation}.nav button.active,.filters button.active,.tripdays button.active,.calendarFilters button.active{background:var(--accent);color:white}.calendarFilters{margin:8px 0 12px;padding-bottom:2px}.calendarFilterHint{font-size:11px;color:var(--muted);margin-top:3px}.page{display:none}.page.active{display:block}.hero,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 18px #9d78840f}.hero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#fff,#ffeaf0)}.catface{font-size:46px;float:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:#fff9fb;padding:12px;border-radius:16px;text-align:center}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.section{margin:18px 0}.sectionhead,.calendarhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.event{display:flex;gap:10px;padding:11px 12px;border-bottom:1px dashed var(--line);align-items:flex-start}.event:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;margin-top:6px}.grow{flex:1}.event h4{margin:0 0 3px;font-size:14px}.event p{margin:0;font-size:12px;color:var(--muted)}.monthtitle{font-size:23px;font-weight:800}.calendarhead{margin:14px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wd{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:112px;background:#fffefa;border:1px solid var(--line);border-radius:15px;padding:6px;overflow:hidden}.day:nth-child(7n),.day:nth-child(7n+1){background:#fff9fb}.day.out{opacity:.35}.dn{font-weight:800;font-size:12px}.holiday{font-size:9px;color:#c95c76}.chip{display:flex;align-items:center;gap:4px;width:100%;border:0;border-radius:9px;padding:4px 5px;margin:3px 0;text-align:left;font-size:10px;color:#493b40;overflow:hidden}.chip .ci{flex:0 0 auto}.chip .ct{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.search{display:flex;gap:7px;margin:10px 0}.search input{flex:1}.field input,.field select,.field textarea,.search input,.memo textarea,.todoInput input,.shopInput input,.captionInput{width:100%;border:1px solid var(--line);background:white;border-radius:13px;padding:10px}.agendaDate{font-weight:800;margin:16px 0 6px}.triphero{padding:20px;margin:14px 0;background:linear-gradient(135deg,#eaf8e9,#fff1f6);border-radius:22px}.fab{position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:white;font-size:26px;box-shadow:0 6px 18px #765b6555}.modal{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fffaf9;border-radius:26px 26px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.sheetactions{display:flex;justify-content:space-between;margin-top:14px}.primary{background:var(--accent);color:white;border:0;border-radius:13px;padding:11px 14px}.danger{background:white;color:#b54c64;border:1px solid #efc2ce;border-radius:13px;padding:10px}.memo textarea{min-height:320px;resize:vertical;line-height:1.7}.todoInput,.shopInput{display:flex;gap:8px}.todoList,.shopList{margin-top:12px}.todoItem,.shopItem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px dashed var(--line)}.doneText{text-decoration:line-through;opacity:.55}.progressBox{margin:12px 0}.progressTrack{height:12px;background:#f1e8e5;border-radius:999px;overflow:hidden}.progressBar{height:100%;background:linear-gradient(90deg,#e6a4b8,#bfa2d8)}.progressLabel{font-size:12px;color:var(--muted);margin-top:5px}.completion-cat{margin:12px 0 4px;padding:14px 16px;border:1px solid #efd8df;border-radius:18px;background:linear-gradient(135deg,#fff9ef,#ffeaf0);display:flex;align-items:center;gap:12px}.completion-cat .face{font-size:38px}.tripGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:14px;align-items:start}.tripCol{padding:14px}.tripRows{display:flex;flex-direction:column;gap:10px}.tripRow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(130px,.75fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fffdfb}.tripTime{font-size:12px;color:var(--muted);margin-bottom:5px}.tripTitle{font-weight:700}.tripNote{font-size:12px;color:var(--muted);margin-top:5px}.tripPhoto{display:flex;flex-direction:column;gap:7px}.tripPhoto img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px;border:1px solid var(--line)}.tripPhotoEmpty{min-height:110px;border:1px dashed #dfc4cc;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;background:#fffafc}.photoBtn{font-size:12px;padding:7px 9px}.small{font-size:12px}.empty{text-align:center;padding:22px;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:95px;padding:4px}.chip{font-size:9px}.grid,.tripGrid{grid-template-columns:1fr}.tripRow{grid-template-columns:minmax(0,1.1fr) minmax(105px,.9fr)}.tripPhoto img{aspect-ratio:1/1}}
</style>
</head>
<body>
<div class="app"><div class="top"><div class="brand"><div><h1>🐾 Orchid's Schedule</h1><div class="muted">工作・生活・旅行・備忘 ฅ^•ﻌ•^ฅ</div></div><button class="btn" id="backup">🐟 備份</button></div><div class="nav" id="nav"><button class="active" data-page="home">🏠 首頁</button><button data-page="calendar">🐾 月曆</button><button data-page="agenda">🧶 總覽</button><button data-page="todoPage">✅ 待辦</button><button data-page="memo">📝 備忘錄</button><button data-page="trip">✈️ 旅遊</button></div></div><main><section id="home" class="page active"></section><section id="calendar" class="page"></section><section id="agenda" class="page"></section><section id="todoPage" class="page"></section><section id="memo" class="page"></section><section id="trip" class="page"></section></main></div>
<button class="fab" id="add">＋</button><input id="importFile" type="file" accept="application/json" hidden>
<div class="modal" id="modal"><div class="sheet"><div class="sectionhead"><h3>🐾 新增／編輯行程</h3><button class="btn" id="close" type="button">✕</button></div><form id="form"><input type="hidden" id="eid"><div class="grid"><div class="field"><label>開始日期</label><input id="date" type="date" required></div><div class="field"><label>結束日期</label><input id="endDate" type="date" required></div><div class="field"><label>分類</label><select id="type"><option value="work">三立</option><option value="clinic">櫃台</option><option value="trip">旅遊</option><option value="date">約會／聚餐</option><option value="personal">個人</option><option value="todo">待辦</option></select></div><div class="field"><label>圖示</label><select id="icon"><option>📰</option><option>🏥</option><option>❤️</option><option>🍴</option><option>☕</option><option>✈️</option><option>🏨</option><option>🚆</option><option>🛍️</option><option>🎂</option><option>🐾</option><option>✅</option><option>📌</option></select></div><div class="field"><label>開始時間</label><input id="start" type="time"></div><div class="field"><label>結束時間</label><input id="end" type="time"></div><div class="field full"><label>行程</label><input id="title" required></div><div class="field"><label>地點</label><input id="location"></div><div class="field"><label>標籤</label><input id="tag"></div><div class="field full"><label>備註</label><textarea id="note"></textarea></div></div><div class="sheetactions"><button type="button" class="danger" id="del">刪除</button><div><button type="button" class="btn" id="cancel">取消</button> <button class="primary">🐾 儲存</button></div></div></form></div></div>
<script>
const T={work:{n:'三立',c:'#dcecff',d:'#6090cf',i:'📰'},clinic:{n:'櫃台',c:'#eadfff',d:'#8665c4',i:'🏥'},trip:{n:'旅遊',c:'#e2f2e1',d:'#5c9b6b',i:'✈️'},date:{n:'約會／聚餐',c:'#ffe0e8',d:'#ce748f',i:'❤️'},personal:{n:'個人',c:'#fff1c9',d:'#c89e3b',i:'🐾'},todo:{n:'待辦',c:'#efeae7',d:'#89837f',i:'✅'}};const H={'2026-09-25':'中秋節','2026-09-28':'教師節補假','2026-10-09':'國慶日補假','2026-10-10':'國慶日','2026-10-25':'光復節','2026-10-26':'補假'};const KEY='planner-2026-v3-cat',MEMO_KEY='orchid-memo-v1',TODO_KEY='orchid-todos-v1',SHOP_KEY='orchid-shop-v1',TRIPMEDIA_KEY='orchid-trip-media-v2',CALFILTER_KEY='orchid-calendar-filters-v2';const CAL_TYPES=['work','clinic','trip','date','personal','todo'];const CAL_LABELS={work:'📰 三立',clinic:'🏥 櫃台',trip:'✈️ 旅遊',date:'❤️ 約會／聚餐',personal:'🐾 個人',todo:'✅ 待辦'};let month=8,filter='all',tripDay='2026-10-04';let calendarFilters=(()=>{try{let x=JSON.parse(localStorage.getItem(CALFILTER_KEY));return Array.isArray(x)?x:CAL_TYPES.slice()}catch{return CAL_TYPES.slice()}})();const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]));
function seed(){let a=[];const o=new Set([4,5,12,13,19,25,28]);for(let d=1;d<=30;d++)if(!o.has(d)&&d!==27)a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,endDate:`2026-09-${String(d).padStart(2,'0')}`,type:'work',icon:'📰',title:'三立｜早班',start:'07:00',end:'16:00'});a.push({id:uid(),date:'2026-09-27',endDate:'2026-09-27',type:'work',icon:'📰',title:'三立｜支援晨班',start:'05:00',end:''});const c=new Set([5,12,18,24,28]);for(let d=1;d<=30;d++){let x=new Date(2026,8,d);if(x.getDay()!==0&&!c.has(d))a.push({id:uid(),date:`2026-09-${String(d).padStart(2,'0')}`,endDate:`2026-09-${String(d).padStart(2,'0')}`,type:'clinic',icon:'🏥',title:'櫃台｜晚班',start:'18:00',end:'22:00'})}a.push({id:uid(),date:'2026-09-04',endDate:'2026-09-04',type:'clinic',icon:'🏥',title:'櫃台｜早診代班',start:'09:00',end:''},{id:uid(),date:'2026-09-04',endDate:'2026-09-04',type:'clinic',icon:'🏥',title:'櫃台｜午診代班',start:'14:00',end:''});a.push({id:uid(),date:'2026-10-04',endDate:'2026-10-08',type:'trip',icon:'✈️',title:'福岡旅行',start:'',end:'',location:'福岡'});return a}
let events=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY));if(!x)return seed();x=x.map(e=>({...e,endDate:e.endDate||e.date,icon:e.icon||T[e.type]?.i||'📌',title:(e.title||'').replace(/^CC｜/,'櫃台｜').replace(/^診所｜/,'櫃台｜')}));localStorage.setItem(KEY,JSON.stringify(x));return x}catch{return seed()}})();let todos=(()=>{try{return JSON.parse(localStorage.getItem(TODO_KEY))||[]}catch{return []}})();let shops=(()=>{try{return JSON.parse(localStorage.getItem(SHOP_KEY))||[]}catch{return []}})();let tripMedia=(()=>{try{return JSON.parse(localStorage.getItem(TRIPMEDIA_KEY))||{}}catch{return {}}})();
function saveEvents(){localStorage.setItem(KEY,JSON.stringify(events));render()}function sortEvents(a){return [...a].sort((x,y)=>(x.date+(x.start||'')).localeCompare(y.date+(y.start||'')))}function fmt(d){return new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00'))}function inRange(e,ds){return ds>=e.date&&ds<=(e.endDate||e.date)}function eventTime(e,ds){if(e.date===e.endDate||!e.endDate)return e.start?(e.start+(e.end?'–'+e.end:'')):'全天';if(ds===e.date)return (e.start?e.start+' 起':'開始');if(ds===e.endDate)return (e.end?'至 '+e.end:'結束');return '跨日'}function ev(e){let range=e.endDate&&e.endDate!==e.date?`${e.date.slice(5)} → ${e.endDate.slice(5)} ・ `:'';return `<div class="event"><span class="dot" style="background:${T[e.type].d}"></span><div class="grow"><h4>${e.icon||T[e.type].i} ${esc(e.title)}</h4><p>${range}${e.start?(e.start+(e.end?'–'+e.end:'')):(e.tag||'全天')}${e.location?' ・ '+esc(e.location):''}</p></div><button class="btn" onclick="edit('${e.id}')">✎</button></div>`}
function home(){let up=sortEvents(events).slice(0,6),done=todos.filter(x=>x.done).length;homeEl.innerHTML=`<div class="hero"><span class="catface">🐱</span><h2>今天也要好好安排喵 ♡</h2><p class="muted">Orchid 的溫馨貓咪手帳</p><div class="stats"><div class="stat"><b>${events.filter(e=>e.type==='work').length}</b><span>📰 三立</span></div><div class="stat"><b>${events.filter(e=>e.type==='clinic').length}</b><span>🏥 櫃台</span></div><div class="stat"><b>${events.filter(e=>e.type==='trip').length}</b><span>✈️ 旅遊</span></div><div class="stat"><b>${done}/${todos.length}</b><span>✅ 待辦完成</span></div></div></div><div class="section"><h3>🐾 近期行程</h3><div class="card">${up.map(ev).join('')||'<div class="empty">目前沒有行程</div>'}</div></div>`}
function toggleCalendarFilter(k){if(k==='all'){calendarFilters=calendarFilters.length===CAL_TYPES.length?[]:CAL_TYPES.slice()}else{calendarFilters=calendarFilters.includes(k)?calendarFilters.filter(x=>x!==k):[...calendarFilters,k]}localStorage.setItem(CALFILTER_KEY,JSON.stringify(calendarFilters));cal()}
function cal(){let first=new Date(2026,month,1),s=new Date(first);s.setDate(1-((first.getDay()+6)%7));let cells='';for(let i=0;i<42;i++){let d=new Date(s);d.setDate(s.getDate()+i);let ds=ymd(d),ls=sortEvents(events.filter(e=>inRange(e,ds)&&calendarFilters.includes(e.type)));cells+=`<div class="day ${d.getMonth()===month?'':'out'}"><div class="dn">${d.getDate()}</div>${H[ds]?`<div class="holiday">${H[ds]}</div>`:''}${ls.slice(0,4).map(e=>`<button class="chip" style="background:${T[e.type].c}" onclick="edit('${e.id}')"><span class="ci">${e.icon||T[e.type].i}</span><span class="ct">${esc(eventTime(e,ds))}${e.title?' '+esc(e.title.replace(/^.*?｜/,'')):''}</span></button>`).join('')}</div>`}let allOn=calendarFilters.length===CAL_TYPES.length;let hint=calendarFilters.length===0?'未選擇任何分類':allOn?'全部分類':calendarFilters.map(k=>CAL_LABELS[k].replace(/^\S+\s/,'' )).join('、');calendarEl.innerHTML=`<div class="calendarhead"><div><div class="muted">🐈 Monthly calendar</div><div class="monthtitle">2026年 ${month===8?'9':'10'}月</div><div class="calendarFilterHint">顯示：${hint}</div></div><div><button class="btn" onclick="chg(-1)">←</button> <button class="btn" onclick="chg(1)">→</button></div></div><div class="calendarFilters"><button class="${allOn?'active':''}" onclick="toggleCalendarFilter('all')">✨ 全部</button>${CAL_TYPES.map(k=>`<button class="${calendarFilters.includes(k)?'active':''}" onclick="toggleCalendarFilter('${k}')">${CAL_LABELS[k]}</button>`).join('')}</div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<div class="wd">週${x}</div>`).join('')}${cells}</div>`}function chg(n){month=Math.max(8,Math.min(9,month+n));cal()}
function agenda(q=''){let ls=sortEvents(events.filter(e=>(filter==='all'||e.type===filter)&&(`${e.title} ${e.location||''}`).includes(q))),out='',last='';for(const e of ls){if(e.date!==last){if(last)out+='</div>';out+=`<div class="agendaDate">🐾 ${fmt(e.date)}</div><div class="card">`;last=e.date}out+=ev(e)}if(last)out+='</div>';agendaEl.innerHTML=`<div class="sectionhead"><h3>🧶 行程總覽</h3><button class="btn" onclick="importFile.click()">匯入</button></div><div class="search"><input placeholder="🔍 搜尋行程" oninput="agenda(this.value)"></div><div class="filters"><button onclick="setF('all')">全部</button>${Object.keys(T).map(k=>`<button onclick="setF('${k}')">${T[k].n}</button>`).join('')}</div>${out||'<div class="empty">沒有符合的行程</div>'}`}function setF(x){filter=x;agenda()}
function progress(done,total){let p=total?Math.round(done/total*100):0;return `<div class="progressBox"><div class="progressTrack"><div class="progressBar" style="width:${p}%"></div></div><div class="progressLabel">完成進度 ${p}%</div>${p===100&&total?'<div class="completion-cat"><div class="face">😸</div><div><b>全部完成啦！</b><div class="small muted">小貓咪也替你開心 ฅ^•ﻌ•^ฅ</div></div></div>':''}</div>`}
function renderTodo(){let done=todos.filter(x=>x.done).length;todoEl.innerHTML=`<div class="sectionhead"><h3>✅ 待辦清單</h3><span class="muted">${done}/${todos.length} 完成</span></div><div class="panel" style="padding:14px"><div class="todoInput"><input id="todoNew" placeholder="新增待辦事項…"><button class="primary" onclick="addTodo()">新增</button></div>${progress(done,todos.length)}<div class="todoList">${todos.map(t=>`<div class="todoItem"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}')"><div class="grow ${t.done?'doneText':''}">${esc(t.text)}</div><button class="btn" onclick="removeTodo('${t.id}')">✕</button></div>`).join('')||'<div class="empty">還沒有待辦事項</div>'}</div></div>`}function addTodo(){let el=document.getElementById('todoNew'),v=el.value.trim();if(!v)return;todos.push({id:uid(),text:v,done:false});localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}function toggleTodo(id){let t=todos.find(x=>x.id===id);if(t)t.done=!t.done;localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}function removeTodo(id){todos=todos.filter(x=>x.id!==id);localStorage.setItem(TODO_KEY,JSON.stringify(todos));renderTodo();home()}
function renderMemo(){memoEl.innerHTML=`<div class="sectionhead"><h3>📝 備忘錄</h3><button class="btn" onclick="clearMemo()">清空</button></div><div class="memo"><textarea id="memoText" placeholder="寫下想記得的事、靈感、購物提醒……"></textarea></div><p class="muted small">內容會自動儲存在這台裝置的瀏覽器中。</p>`;let ta=document.getElementById('memoText');ta.value=localStorage.getItem(MEMO_KEY)||'';ta.oninput=()=>localStorage.setItem(MEMO_KEY,ta.value)}function clearMemo(){if(confirm('確定要清空備忘錄嗎？')){localStorage.removeItem(MEMO_KEY);renderMemo()}}
function getMedia(id){return tripMedia[id]||{src:'',caption:'',showCaption:true}}function trip(){let days=['2026-10-04','2026-10-05','2026-10-06','2026-10-07','2026-10-08'],ls=sortEvents(events.filter(e=>e.type==='trip'&&inRange(e,tripDay))),s=shops.filter(x=>x.date===tripDay),done=s.filter(x=>x.done).length;tripEl.innerHTML=`<div class="triphero"><h2>🐱✈️ 福岡・5天旅程</h2><p>左邊看行程與時間，右邊放照片與簡短敘述</p></div><div class="tripdays">${days.map((d,i)=>`<button class="${tripDay===d?'active':''}" onclick="tripDay='${d}';trip()">Day ${i+1}<br><small>${d.slice(5)}</small></button>`).join('')}</div><h3>🐾 ${fmt(tripDay)}</h3><div class="tripGrid"><div class="card tripCol"><div class="sectionhead"><h3>📍 行程＋照片</h3><button class="btn" onclick="newTripEvent()">＋ 新增</button></div><div class="tripRows">${ls.map(e=>tripRow(e)).join('')||'<div class="empty">尚未安排詳細行程</div>'}</div></div><div class="card tripCol"><div class="sectionhead"><h3>🛍️ 購物清單</h3><span class="muted">${done}/${s.length}</span></div><div class="shopInput"><input id="shopNew" placeholder="想買什麼？"><button class="primary" onclick="addShop()">新增</button></div>${progress(done,s.length)}<div class="shopList">${s.map(x=>`<div class="shopItem"><input type="checkbox" ${x.done?'checked':''} onchange="toggleShop('${x.id}')"><div class="grow ${x.done?'doneText':''}">${esc(x.text)}</div><button class="btn" onclick="removeShop('${x.id}')">✕</button></div>`).join('')||'<div class="empty">這天還沒有購物清單</div>'}</div></div></div>`}
function tripRow(e){let m=getMedia(e.id),time=eventTime(e,tripDay);return `<div class="tripRow"><div><div class="tripTime">${e.icon||'✈️'} ${esc(time)}</div><div class="tripTitle">${esc(e.title)}</div>${e.location?`<div class="tripNote">📍 ${esc(e.location)}</div>`:''}${e.note?`<div class="tripNote">${esc(e.note)}</div>`:''}<button class="btn small" style="margin-top:8px" onclick="edit('${e.id}')">編輯行程</button></div><div class="tripPhoto">${m.src?`<img src="${m.src}" alt="trip photo">`:'<div class="tripPhotoEmpty">尚未加入照片</div>'}<input id="photo-${e.id}" type="file" accept="image/*" hidden onchange="setTripPhoto('${e.id}',event)"><button class="btn photoBtn" onclick="document.getElementById('photo-${e.id}').click()">📷 ${m.src?'更換':'加入'}照片</button>${m.src?`<label class="small"><input type="checkbox" ${m.showCaption!==false?'checked':''} onchange="toggleCaption('${e.id}',this.checked)"> 顯示簡短敘述</label><input class="captionInput" value="${esc(m.caption||'')}" placeholder="例如：太宰府散步、午餐很好吃…" oninput="saveCaption('${e.id}',this.value)" ${m.showCaption===false?'style="display:none"':''}>${m.showCaption!==false&&m.caption?`<div class="small muted">${esc(m.caption)}</div>`:''}`:''}</div></div>`}
function newTripEvent(){openNew();date.value=tripDay;endDate.value=tripDay;type.value='trip';icon.value='✈️'}function addShop(){let el=document.getElementById('shopNew'),v=el.value.trim();if(!v)return;shops.push({id:uid(),date:tripDay,text:v,done:false});localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}function toggleShop(id){let x=shops.find(y=>y.id===id);if(x)x.done=!x.done;localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}function removeShop(id){shops=shops.filter(x=>x.id!==id);localStorage.setItem(SHOP_KEY,JSON.stringify(shops));trip()}
async function setTripPhoto(id,e){let f=e.target.files[0];if(!f)return;let src=await compressImage(f);tripMedia[id]={...getMedia(id),src};try{localStorage.setItem(TRIPMEDIA_KEY,JSON.stringify(tripMedia))}catch(err){alert('照片儲存空間已滿，請更換較小的照片。')}trip()}function compressImage(file){return new Promise(res=>{let img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{let c=document.createElement('canvas'),max=900,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};img.src=r.result};r.readAsDataURL(file)})}function saveCaption(id,v){tripMedia[id]={...getMedia(id),caption:v};localStorage.setItem(TRIPMEDIA_KEY,JSON.stringify(tripMedia))}function toggleCaption(id,v){tripMedia[id]={...getMedia(id),showCaption:v};localStorage.setItem(TRIPMEDIA_KEY,JSON.stringify(tripMedia));trip()}
function render(){home();cal();agenda();renderTodo();renderMemo();trip()}function openNew(){form.reset();eid.value='';let d=month===8?'2026-09-01':'2026-10-01';date.value=d;endDate.value=d;type.value='personal';icon.value='🐾';del.style.visibility='hidden';modal.classList.add('open')}function edit(id){let e=events.find(x=>x.id===id);if(!e)return;eid.value=e.id;date.value=e.date;endDate.value=e.endDate||e.date;type.value=e.type;icon.value=e.icon||T[e.type].i;start.value=e.start||'';end.value=e.end||'';title.value=e.title;location.value=e.location||'';tag.value=e.tag||'';note.value=e.note||'';del.style.visibility='visible';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
form.onsubmit=e=>{e.preventDefault();if(endDate.value<date.value){alert('結束日期不可早於開始日期');return}let o={id:eid.value||uid(),date:date.value,endDate:endDate.value,type:type.value,icon:icon.value,title:title.value,start:start.value,end:end.value,location:location.value,tag:tag.value,note:note.value},i=events.findIndex(x=>x.id===o.id);i>=0?events[i]=o:events.push(o);saveEvents();closeModal()};del.onclick=()=>{let id=eid.value;events=events.filter(x=>x.id!==id);delete tripMedia[id];localStorage.setItem(TRIPMEDIA_KEY,JSON.stringify(tripMedia));saveEvents();closeModal()};document.getElementById('close').addEventListener('click',closeModal);document.getElementById('cancel').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});add.onclick=openNew;nav.onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active')};backup.onclick=()=>{let data={events,todos,shops,tripMedia,memo:localStorage.getItem(MEMO_KEY)||''},b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='orchid-schedule-backup.json';a.click()};importFile.onchange=async()=>{let x=JSON.parse(await importFile.files[0].text());if(x.events)events=x.events.map(e=>({...e,endDate:e.endDate||e.date,icon:e.icon||T[e.type]?.i||'📌'}));if(x.todos)todos=x.todos;if(x.shops)shops=x.shops;if(x.tripMedia)tripMedia=x.tripMedia;if(typeof x.memo==='string')localStorage.setItem(MEMO_KEY,x.memo);localStorage.setItem(KEY,JSON.stringify(events));localStorage.setItem(TODO_KEY,JSON.stringify(todos));localStorage.setItem(SHOP_KEY,JSON.stringify(shops));localStorage.setItem(TRIPMEDIA_KEY,JSON.stringify(tripMedia));render()};const homeEl=document.getElementById('home'),calendarEl=document.getElementById('calendar'),agendaEl=document.getElementById('agenda'),todoEl=document.getElementById('todoPage'),memoEl=document.getElementById('memo'),tripEl=document.getElementById('trip');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script>
